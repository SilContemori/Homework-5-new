<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ paper.title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: #f5f5f5;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 30px 0;
        }
        .paper-container {
            background: white;
            border-radius: 8px;
            padding: 50px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 1000px;
            margin: 0 auto;
            border-top: 4px solid #c53030;
        }
        .back-btn {
            color: #c53030;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 25px;
            transition: color 0.2s;
        }
        .back-btn:hover {
            color: #9b2c2c;
            text-decoration: underline;
        }
        h1 {
            color: #1a202c;
            font-weight: 600;
            font-size: 1.8rem;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .authors {
            color: #718096;
            font-size: 1rem;
            margin-bottom: 30px;
            font-style: italic;
        }
        .paper-content {
            line-height: 1.8;
            color: #2d3748;
            font-size: 1.05rem;
        }
        .paper-content table {
            margin: 25px 0;
            border-collapse: collapse;
        }
        .paper-content img {
            max-width: 100%;
            height: auto;
            margin: 25px 0;
            border: 1px solid #e2e8f0;
        }
        /* Highlight per la tabella target */
        .table-highlight {
            border: 3px solid #c53030 !important;
            border-radius: 4px;
            padding: 20px;
            background: #fff5f5;
            box-shadow: 0 2px 8px rgba(197, 48, 48, 0.2);
            transition: all 0.3s;
        }
        .table-indicator {
            background: #c53030;
            color: white;
            padding: 12px 25px;
            border-radius: 4px;
            margin: 25px 0;
            font-weight: 600;
            font-size: 0.95rem;
            text-align: center;
        }
        .table-indicator.warning {
            background: #e53e3e;
        }
        hr {
            border-color: #e2e8f0;
            margin: 30px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="paper-container">
            <a href="/" class="back-btn">← Back to search</a>

            <h1>{{ paper.title }}</h1>
            <p class="authors">{{ paper.authors }}</p>

            {% if table_number %}
                <div class="table-indicator" id="tableIndicator">
                    Navigating to Table {{ table_number }}
                </div>
            {% endif %}

            <hr>

            <div class="paper-content" id="paperContent">
                {{ paper.html_content|safe }}
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const tableNumber = urlParams.get('table');

            if (tableNumber) {
                scrollToTable(parseInt(tableNumber));
            }
        });

        function scrollToTable(targetNumber) {
            const tables = document.querySelectorAll('.paper-content table');
            const figures = document.querySelectorAll('.paper-content figure');

            let targetElement = null;
            let foundCount = 0;

            // Cerca tra le tabelle
            for (let table of tables) {
                let wrapper = table.closest('figure, div[class*="table"], div[class*="Table"]');
                if (!wrapper) {
                    wrapper = table;
                }

                foundCount++;

                if (foundCount === targetNumber) {
                    targetElement = wrapper;
                    break;
                }
            }

            // Se non trovata tra le tabelle, cerca tra le figure
            if (!targetElement) {
                foundCount = 0;
                for (let figure of figures) {
                    if (figure.querySelector('table')) {
                        foundCount++;
                        if (foundCount === targetNumber) {
                            targetElement = figure;
                            break;
                        }
                    }
                }
            }

            if (targetElement) {
                targetElement.classList.add('table-highlight');

                const elementPosition = targetElement.getBoundingClientRect().top;
                const offsetPosition = elementPosition + window.pageYOffset - 100;

                window.scrollTo({
                    top: offsetPosition,
                    behavior: 'smooth'
                });

                // Rimuovi l'indicatore dopo 4 secondi
                setTimeout(function() {
                    const indicator = document.getElementById('tableIndicator');
                    if (indicator) {
                        indicator.style.transition = 'opacity 0.5s';
                        indicator.style.opacity = '0';
                        setTimeout(() => indicator.remove(), 500);
                    }
                }, 4000);
            } else {
                console.warn('Table ' + targetNumber + ' not found');
                const indicator = document.getElementById('tableIndicator');
                if (indicator) {
                    indicator.textContent = 'Table ' + targetNumber + ' not found. Showing full document.';
                    indicator.classList.add('warning');
                }
            }
        }
    </script>
</body>
</html>
