<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ paper.title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: #f5f5f5;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 30px 0;
        }
        .paper-container {
            background: white;
            border-radius: 8px;
            padding: 50px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 1000px;
            margin: 0 auto;
            border-top: 4px solid #c53030;
        }
        .back-btn {
            color: #c53030;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 25px;
            transition: color 0.2s;
        }
        .back-btn:hover {
            color: #9b2c2c;
            text-decoration: underline;
        }
        h1 {
            color: #1a202c;
            font-weight: 600;
            font-size: 1.8rem;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .authors {
            color: #718096;
            font-size: 1rem;
            margin-bottom: 30px;
            font-style: italic;
        }
        .paper-content {
            line-height: 1.8;
            color: #2d3748;
            font-size: 1.05rem;
        }
        .paper-content img {
            max-width: 100%;
            height: auto;
            margin: 25px 0;
            border: 1px solid #e2e8f0;
        }
        /* Fix per formule MathJax */
        .paper-content mjx-container {
            margin: 15px 0;
            overflow-x: auto;
        }
        /* Fix per algoritmi e codice */
        .paper-content pre,
        .paper-content code {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            padding: 15px;
            overflow-x: auto;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .paper-content pre {
            margin: 20px 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        /* Fix per tabelle - preserva stile originale */
        .paper-content table {
            margin: 25px 0;
            border-collapse: collapse;
            display: table;
        }
        .paper-content table td,
        .paper-content table th {
            padding: 8px 12px;
            border: 1px solid #ddd;
        }
        /* Fix per figure */
        .paper-content figure {
            margin: 25px 0;
            text-align: center;
        }
        .paper-content figure img {
            display: inline-block;
        }
        .paper-content figure figcaption {
            margin-top: 10px;
            font-style: italic;
            color: #718096;
            font-size: 0.95rem;
        }
        /* Fix per SVG */
        .paper-content svg {
            max-width: 100%;
            height: auto;
            margin: 15px 0;
        }
        /* Highlight per la tabella target */
        .table-highlight {
            border: 3px solid #c53030 !important;
            border-radius: 4px;
            padding: 20px;
            background: #fff5f5;
            box-shadow: 0 2px 8px rgba(197, 48, 48, 0.2);
            transition: all 0.3s;
        }
        /* Highlight per la figura target */
        .figure-highlight {
            border: 3px solid #c53030 !important;
            border-radius: 4px;
            padding: 20px;
            background: #fff5f5;
            box-shadow: 0 2px 8px rgba(197, 48, 48, 0.2);
            transition: all 0.3s;
        }
        /* Highlight per la query nel testo */
        .query-highlight {
            background: linear-gradient(120deg, #fff5f5 0%, #fed7d7 100%);
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 500;
        }
        .table-indicator {
            background: #c53030;
            color: white;
            padding: 12px 25px;
            border-radius: 4px;
            margin: 25px 0;
            font-weight: 600;
            font-size: 0.95rem;
            text-align: center;
        }
        .table-indicator.warning {
            background: #e53e3e;
        }
        /* Nascondi il footer di ar5iv */
        footer, .footer, [class*="footer"], [id*="footer"] {
            display: none !important;
        }
        hr {
            border-color: #e2e8f0;
            margin: 30px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="paper-container">
            <a href="/" class="back-btn">← Back to search</a>

            <h1>{{ paper.title }}</h1>
            <p class="authors">{{ paper.authors }}</p>

            {% if table_number %}
                <div class="table-indicator" id="tableIndicator">
                    Navigating to Table {{ table_number }}
                </div>
            {% elif figure_id %}
                <div class="table-indicator" id="figureIndicator">
                    Navigating to Figure {{ figure_id }}
                </div>
            {% elif query %}
                <div class="table-indicator" id="queryIndicator">
                    Highlighting: "{{ query }}"
                </div>
            {% endif %}

            <hr>

            <div class="paper-content" id="paperContent">
                {{ paper.html_content|safe }}
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const tableNumber = urlParams.get('table');
            const figureId = urlParams.get('figure');
            const query = urlParams.get('query');

            if (tableNumber) {
                scrollToTable(parseInt(tableNumber));
            } else if (figureId) {
                scrollToFigure(figureId);
            } else if (query) {
                highlightQuery(query);
            }
        });

        function scrollToTable(targetNumber) {
            const tables = document.querySelectorAll('.paper-content table');
            const figures = document.querySelectorAll('.paper-content figure');

            let targetElement = null;
            let foundCount = 0;

            // Cerca tra le tabelle
            for (let table of tables) {
                let wrapper = table.closest('figure, div[class*="table"], div[class*="Table"]');
                if (!wrapper) {
                    wrapper = table;
                }

                foundCount++;

                if (foundCount === targetNumber) {
                    targetElement = wrapper;
                    break;
                }
            }

            // Se non trovata tra le tabelle, cerca tra le figure
            if (!targetElement) {
                foundCount = 0;
                for (let figure of figures) {
                    if (figure.querySelector('table')) {
                        foundCount++;
                        if (foundCount === targetNumber) {
                            targetElement = figure;
                            break;
                        }
                    }
                }
            }

            if (targetElement) {
                targetElement.classList.add('table-highlight');

                const elementPosition = targetElement.getBoundingClientRect().top;
                const offsetPosition = elementPosition + window.pageYOffset - 100;

                window.scrollTo({
                    top: offsetPosition,
                    behavior: 'smooth'
                });

                // Rimuovi l'indicatore dopo 4 secondi
                setTimeout(function() {
                    const indicator = document.getElementById('tableIndicator');
                    if (indicator) {
                        indicator.style.transition = 'opacity 0.5s';
                        indicator.style.opacity = '0';
                        setTimeout(() => indicator.remove(), 500);
                    }
                }, 4000);
            } else {
                console.warn('Table ' + targetNumber + ' not found');
                const indicator = document.getElementById('tableIndicator');
                if (indicator) {
                    indicator.textContent = 'Table ' + targetNumber + ' not found. Showing full document.';
                    indicator.classList.add('warning');
                }
            }
        }

        function scrollToFigure(targetFigureId) {
            // Estrai il numero dal figure_id (es. "fig_0" -> 0, "fig_1" -> 1)
            const figureIndex = parseInt(targetFigureId.replace('fig_', ''));

            // Trova tutte le figure nel documento
            const figures = document.querySelectorAll('.paper-content figure, .paper-content div[class*="figure"], .paper-content div[class*="Figure"]');

            // Filtra solo le figure che contengono immagini
            const validFigures = [];
            for (let fig of figures) {
                if (fig.querySelector('img')) {
                    validFigures.push(fig);
                }
            }

            // Se non ci sono abbastanza figure valide, cerca anche le immagini dirette
            if (figureIndex >= validFigures.length) {
                const images = document.querySelectorAll('.paper-content img');
                if (figureIndex < images.length) {
                    const img = images[figureIndex];
                    const wrapper = img.closest('figure, div[class*="figure"], div[class*="Figure"]');
                    if (wrapper) {
                        wrapper.classList.add('figure-highlight');
                        scrollToElement(wrapper);
                        return;
                    }
                }
            }

            // Trova la figura all'indice specificato
            if (figureIndex < validFigures.length) {
                const targetElement = validFigures[figureIndex];
                targetElement.classList.add('figure-highlight');
                scrollToElement(targetElement);

                // Rimuovi l'indicatore dopo 4 secondi
                setTimeout(function() {
                    const indicator = document.getElementById('figureIndicator');
                    if (indicator) {
                        indicator.style.transition = 'opacity 0.5s';
                        indicator.style.opacity = '0';
                        setTimeout(() => indicator.remove(), 500);
                    }
                }, 4000);
            } else {
                console.warn('Figure ' + targetFigureId + ' (index ' + figureIndex + ') not found');
                const indicator = document.getElementById('figureIndicator');
                if (indicator) {
                    indicator.textContent = 'Figure ' + targetFigureId + ' not found. Showing full document.';
                    indicator.classList.add('warning');
                }
            }
        }

        function scrollToElement(element) {
            const elementPosition = element.getBoundingClientRect().top;
            const offsetPosition = elementPosition + window.pageYOffset - 100;

            window.scrollTo({
                top: offsetPosition,
                behavior: 'smooth'
            });
        }

        function highlightQuery(queryText) {
            const paperContent = document.getElementById('paperContent');

            // Funzione helper per attraversare e modificare i nodi di testo
            function highlightInElement(element) {
                const walker = document.createTreeWalker(
                    element,
                    NodeFilter.SHOW_TEXT,
                    {
                        acceptNode: function(node) {
                            // Ignora nodi dentro script, style, o già highlightati
                            if (node.parentElement.tagName === 'SCRIPT' ||
                                node.parentElement.tagName === 'STYLE' ||
                                node.parentElement.classList.contains('query-highlight')) {
                                return NodeFilter.FILTER_REJECT;
                            }
                            // Accetta solo nodi che contengono la query
                            if (node.textContent.toLowerCase().includes(queryText.toLowerCase())) {
                                return NodeFilter.FILTER_ACCEPT;
                            }
                            return NodeFilter.FILTER_REJECT;
                        }
                    }
                );

                const textNodes = [];
                let node;
                while (node = walker.nextNode()) {
                    textNodes.push(node);
                }

                // Evidenzia ogni nodo di testo trovato
                textNodes.forEach(function(textNode) {
                    const text = textNode.textContent;
                    const regex = new RegExp(`(${escapeRegExp(queryText)})`, 'gi');
                    const newHTML = text.replace(regex, '<span class="query-highlight">$1</span>');

                    if (newHTML !== text) {
                        const span = document.createElement('span');
                        span.innerHTML = newHTML;
                        textNode.parentNode.replaceChild(span, textNode);
                    }
                });
            }

            function escapeRegExp(string) {
                return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            // Esegui l'evidenziazione
            highlightInElement(paperContent);

            // Rimuovi l'indicatore dopo 4 secondi
            setTimeout(function() {
                const indicator = document.getElementById('queryIndicator');
                if (indicator) {
                    indicator.style.transition = 'opacity 0.5s';
                    indicator.style.opacity = '0';
                    setTimeout(() => indicator.remove(), 500);
                }
            }, 4000);
        }
    </script>
</body>
</html>
