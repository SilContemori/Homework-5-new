<!DOCTYPE html>
<html>
<head>
    <title>{{ paper.title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { padding: 20px; }
        .paper-content { max-width: 900px; margin: 0 auto; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="btn btn-outline-secondary mb-3">← Torna alla ricerca</a>
        <h1>{{ paper.title }}</h1>
        <p class="text-muted"><strong>Autori:</strong> {{ paper.authors }}</p>
        <hr>
        <div class="paper-content">
            {{ paper.html_content|safe }}
        </div>
    </div>
</body>
</html>
