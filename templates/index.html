<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Search Engine - Entity Resolution</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: #f5f5f5;
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .search-container {
            background: white;
            border-radius: 8px;
            padding: 50px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 750px;
            width: 100%;
            border-top: 4px solid #c53030;
        }
        h1 {
            color: #1a202c;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }
        .subtitle {
            color: #718096;
            margin-bottom: 35px;
            font-size: 1rem;
            font-style: italic;
        }
        .form-control, .form-select {
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            padding: 12px 15px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        .form-control:focus, .form-select:focus {
            border-color: #c53030;
            box-shadow: 0 0 0 2px rgba(197, 48, 48, 0.1);
        }
        .btn-search {
            background: #c53030;
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .btn-search:hover {
            background: #9b2c2c;
        }
        .info-text {
            color: #718096;
            margin-top: 30px;
            font-size: 0.9rem;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }
        .institution {
            color: #c53030;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <div class="institution">Information Retrieval Project</div>
        <h1 class="text-center">Academic Search Engine</h1>
        <p class="subtitle text-center">Entity Resolution & Entity Matching Literature</p>

        <form action="/search" method="get">
            <div class="mb-3">
                <input
                    type="text"
                    name="q"
                    class="form-control form-control-lg"
                    placeholder="Search documents, tables, and figures..."
                    required
                >
            </div>

            <div class="row g-3">
                <div class="col-md-5">
                    <select name="category" class="form-select form-select-lg">
                        <option value="papers">Documents</option>
                        <option value="tables">Tables</option>
                        <option value="figures">Figures</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <select name="mode" class="form-select form-select-lg">
                        <option value="fulltext">Full-text</option>
                        <option value="boolean">Boolean (AND, OR, NOT)</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-search w-100">
                        Search
                    </button>
                </div>
            </div>
            <p class="info-text text-center" style="margin-top: 15px; padding-top: 10px; border-top: none; font-size: 0.8rem;">
                Boolean mode: use AND, OR, NOT, "exact phrase", (grouping)
            </p>
        </form>

        <p class="info-text text-center">
            Advanced search system for scientific documents<br>
            Ingegneria dei Dati - Homework 5
        </p>
    </div>
</body>
</html>
