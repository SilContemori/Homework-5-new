<!DOCTYPE html>
<html>
<head>
    <title>ArXiv Search Engine</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5 text-center">
    <h1 class="mb-4">AI Research Search Engine</h1>
    <form action="/search" method="get" class="row g-3 justify-content-center">
        <div class="col-md-6">
            <input type="text" name="q" class="form-control form-control-lg" placeholder="Cerca qualcosa..." required>
        </div>
        <div class="col-md-2">
            <select name="category" class="form-select form-select-lg">
                <option value="papers">Documenti</option>
                <option value="tables">Tabelle</option>
                <option value="figures">Figure</option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary btn-lg">Cerca</button>
        </div>
    </form>
</body>
</html>
